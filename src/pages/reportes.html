<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - JUICY BURGERS & MEALS</title>
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/body.css">
    <link rel="stylesheet" href="../styles/reportes.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="../fonts/fontawesome/css/all.min.css">
    <link rel="shortcut icon" href="../../logoBurguers.png" type="image/x-icon" size="16x16">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="nav">
            <div class="logo">
                <img src="../assets/logo.png" alt="Logo">
                <div class="name">JUICY BURGERS & MEALS</div>
            </div>
            <div class="items">
                <div class="item"><a href="../../index.html"><i class="fas fa-home"></i> Inicio</a></div>
                <div class="item"><a href="caja-ventas.html"><i class="fas fa-cash-register"></i> Caja</a></div>
                <div class="item"><a href="reportes.html"><i class="fas fa-chart-line"></i> Reportes</a></div>
                <div class="item"><a href="inventario.html"><i class="fas fa-boxes"></i> Inventario</a></div>
                <div class="item"><a href="#" id="logout"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a></div>
            </div>
        </div>
    </header>

    <!-- Contenido de la página de reportes -->
    <div class="container">
        <h1 class="titulo-reportes">Centro de Reportes</h1>
        <div class="reportes">
            <!-- Reporte de ventas totales -->
            <div class="reporte">
                <h2><i class="fas fa-dollar-sign"></i> Ventas Totales</h2>
                <p id="ventas-totales">$0.00</p>
            </div>

            <!-- Reporte de mesas ocupadas -->
            <div class="reporte">
                <h2><i class="fas fa-table"></i> Mesas Ocupadas</h2>
                <p id="mesas-ocupadas">0</p>
            </div>

            <!-- Reporte de productos más vendidos -->
            <div class="reporte">
                <h2><i class="fas fa-utensils"></i> Productos Más Vendidos</h2>
                <ul id="productos-vendidos"></ul>
            </div>
        </div>
    </div>

    <!-- Footer (llamado como en tu ejemplo) -->
    <footer>
        <p>Derechos de autor 2025 | Universidad de Oriente</p>
    </footer>

    <script>
        function contarMesasOcupadas() {
            const data = localStorage.getItem('jc_mesas');
            if (!data) return 0;
            const mesas = JSON.parse(data);
            return Object.values(mesas).filter(items => items.length > 0).length;
        }

        function calcularVentas() {
            const data = localStorage.getItem('jc_ventas');
            if (!data) return 0;
            const ventas = JSON.parse(data);
            return ventas.reduce((sum, v) => sum + v.total, 0);
        }

        function productosMasVendidos() {
            const data = localStorage.getItem('jc_ventas');
            if (!data) return [];
            const ventas = JSON.parse(data);
            const conteo = {};
            ventas.forEach(v => {
                v.items.forEach(item => {
                    conteo[item.nombre] = (conteo[item.nombre] || 0) + 1;
                });
            });
            return Object.entries(conteo)
                .sort((a, b) => b[1] - a[1])
                .map(([nombre, cantidad]) => ({ nombre, cantidad }));
        }

        const total = calcularVentas();
        const ocupadas = contarMesasOcupadas();
        const topProductos = productosMasVendidos();

        document.getElementById('ventas-totales').textContent = `$${total.toFixed(2)}`;
        document.getElementById('mesas-ocupadas').textContent = ocupadas;

        const listaProductos = document.getElementById('productos-vendidos');
        if (topProductos.length === 0) {
            listaProductos.innerHTML = '<li>Sin ventas registradas</li>';
        } else {
            topProductos.forEach(p => {
                const item = document.createElement('li');
                item.textContent = `${p.nombre}: ${p.cantidad} vendidos`;
                listaProductos.appendChild(item);
            });
        }

        // Cerrar sesión
        document.getElementById("logout").addEventListener("click", function() {
            sessionStorage.removeItem("loggedIn");
            window.location.href = "inicio-sesion.html";
        });
    </script>
</body>
</html>
